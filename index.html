<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AImage Studio | The Architecture of Neural-Reality</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #050505;
            --text-color: #ffffff;
            --accent-color: #00d4ff; /* Neural Cyan */
            --grid-gap: 20px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            line-height: 1.6;
        }

        /* Architectural Header */
        header {
            padding: 40px 20px;
            text-align: center;
            border-bottom: 1px solid #1a1a1a;
        }

        .logo { font-weight: 200; letter-spacing: 5px; font-size: 1.5rem; text-transform: uppercase; }
        .logo span { font-weight: 700; color: var(--accent-color); }

        nav { margin-top: 20px; }
        nav a { color: #888; text-decoration: none; margin: 0 15px; font-size: 0.9rem; transition: 0.3s; text-transform: uppercase; }
        nav a:hover { color: var(--accent-color); }

        /* The Neural Grid System */
        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        
        .hero-text { margin-bottom: 40px; text-align: center; }
        .hero-text h1 { font-size: 1.2rem; font-weight: 300; color: #ccc; }

        .neural-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: var(--grid-gap);
        }

        .neural-item {
            position: relative;
            aspect-ratio: 9 / 16;
            overflow: hidden;
            border: 1px solid #222;
            transition: 0.5s cubic-bezier(0.165, 0.84, 0.44, 1);
            background: #111;
        }

        .neural-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: 0.8s ease;
            filter: grayscale(20%);
        }

        .neural-item:hover {
            border-color: var(--accent-color);
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.2);
            z-index: 2;
        }

        .neural-item:hover img { transform: scale(1.05); filter: grayscale(0%) brightness(1.1); }

        /* Footer */
        footer { padding: 60px 20px; text-align: center; color: #444; font-size: 0.8rem; border-top: 1px solid #1a1a1a; }
        .social-links { margin-bottom: 20px; }
        .social-links a { color: #fff; font-size: 1.2rem; margin: 0 10px; transition: 0.3s; }
        .social-links a:hover { color: var(--accent-color); }

        @media (max-width: 768px) { .neural-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <header>
        <div class="logo">AImage <span>Studio</span></div>
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="services.html">Services</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <div class="container">
        <div class="hero-text">
            <h1>Filmed by humans. <span>Powered by AI.</span></h1>
        </div>

        <div class="neural-grid">
            <a href="https://www.instagram.com/p/DVPDSFPAZWu/" class="neural-item" target="_blank">
                <img src="https://via.placeholder.com/1080x1920/111/111?text=AImage+Synthesis+01" alt="AImage Studio Neural Reel">
            </a>
            
            <a href="https://www.instagram.com/p/DS8MpeSk4as/" class="neural-item" target="_blank">
                <img src="https://via.placeholder.com/1080x1920/111/111?text=AImage+Synthesis+02" alt="AImage Studio Neural Reel">
            </a>

            <a href="#" class="neural-item" target="_blank">
                <img src="https://via.placeholder.com/1080x1920/111/111?text=AImage+Synthesis+03" alt="AImage Studio Neural Reel">
            </a>
        </div>
    </div>

    <footer>
        <div class="social-links">
            <a href="https://www.instagram.com/streetbya/" target="_blank"><i class="fab fa-instagram"></i></a>
            <a href="https://tiktok.com/@youraccount" target="_blank"><i class="fab fa-tiktok"></i></a>
            <a href="#"><i class="fab fa-youtube"></i></a>
        </div>
        <p>&copy; 2026 AImage Studio | The Architecture of Neural-Reality</p>
    </footer>

</body>
</html>
